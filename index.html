<!DOCTYPE html>
<html>
<head>
    <title>Absensi Digital</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            padding: 20px;
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 15px;
            max-width: 350px;
            margin: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        input {
            padding: 10px;
            width: 90%;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            background: #4facfe;
            color: white;
            font-weight: bold;
        }

        video, canvas {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h2>📸 Absensi Digital</h2>

<div class="card">

<input type="text" id="nama" placeholder="Masukkan Nama">
<br>

<video id="video" autoplay playsinline></video>

<button onclick="ambilFoto()">Ambil Foto</button>

<canvas id="canvas"></canvas>

<button onclick="absen()">Absen Sekarang</button>

<p id="status"></p>

</div>

<script>
let fotoData = "";

// Kamera (FIX iPhone)
navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
})
.then(stream => {
    let video = document.getElementById("video");
    video.srcObject = stream;
    video.play();
})
.catch(err => {
    alert("Kamera error: " + err);
});

// Ambil Foto
function ambilFoto() {
    let canvas = document.getElementById("canvas");
    let video = document.getElementById("video");
    let ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);
    fotoData = canvas.toDataURL("image/png");
}

// Absen
function absen() {
    let nama = document.getElementById("nama").value;

    if (!nama) {
        alert("Isi nama dulu!");
        return;
    }

    if (!fotoData) {
        alert("Ambil foto dulu!");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        fetch("https://script.google.com/macros/s/AKfycbwEpV-uMN6RkRWu4wKemzbTuV8STGAjM5J7L5Ng4oHT3o9QEispK7glBAR02h4f7A/exec", {
            method: "POST",
            body: JSON.stringify({
                nama: nama,
                waktu: new Date().toLocaleString(),
                latitude: lat,
                longitude: lon,
                foto: fotoData
            })
        })
        .then(res => res.text())
        .then(() => {
            document.getElementById("status").innerText = "✅ Absensi Berhasil!";
        });

    }, () => {
        alert("Lokasi tidak diizinkan");
    });
}
</script>

</body>
</html>
