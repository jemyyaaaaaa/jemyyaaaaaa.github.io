<!DOCTYPE html>
<html>
<head>
    <title>absensi smart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 20px;
            max-width: 350px;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        input {
            padding: 12px;
            width: 90%;
            border-radius: 10px;
            border: none;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            background: #00c6ff;
            color: white;
            font-weight: bold;
        }

        video, canvas {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            transform: scaleX(-1); /* biar gak mirror */
        }

        .info {
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h2>🚀 absensi smart system</h2>

<div class="card">

<input type="text" id="nama" placeholder="Masukkan Nama">

<video id="video" autoplay playsinline></video>

<button onclick="ambilFoto()">📸 Ambil Foto</button>

<canvas id="canvas"></canvas>

<p class="info" id="lokasi">📍 Lokasi: belum diambil</p>

<button onclick="absen()">✅ Absen Sekarang</button>

<p id="status"></p>

</div>

<script>
let fotoData = "";
let latitude = "";
let longitude = "";

// kamera (tidak mirror hasil)
navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
})
.then(stream => {
    let video = document.getElementById("video");
    video.srcObject = stream;
    video.play();
})
.catch(err => {
    alert("kamera error: " + err);
});

// ambil Foto
function ambilFoto() {
    let canvas = document.getElementById("canvas");
    let video = document.getElementById("video");
    let ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // BALIK LAGI AGAR NORMAL (tidak mirror hasil foto)
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(video, 0, 0);
    fotoData = canvas.toDataURL("image/png");

    ambilLokasi();
}

// ambil GPS
function ambilLokasi() {
    navigator.geolocation.getCurrentPosition(pos => {
        latitude = pos.coords.latitude;
        longitude = pos.coords.longitude;

        document.getElementById("lokasi").innerText =
            "📍 " + latitude + ", " + longitude;
    }, () => {
        alert("gagal ambil lokasi");
    });
}

// Absen
function absen() {
    let nama = document.getElementById("nama").value;

    if (!nama) {
        alert("isi nama dulu!");
        return;
    }

    if (!fotoData) {
        alert("ambil foto dulu!");
        return;
    }

    fetch("https://script.google.com/macros/s/AKfycbwEpV-uMN6RkRWu4wKemzbTuV8STGAjM5J7L5Ng4oHT3o9QEispK7glBAR02h4f7A/exec", {
        method: "POST",
        body: JSON.stringify({
            nama: nama,
            waktu: new Date().toLocaleString(),
            latitude: latitude,
            longitude: longitude,
            foto: fotoData
        })
    })
    .then(res => res.text())
    .then(() => {
        document.getElementById("status").innerText = "✅ Absensi berhasil!";
    });
}
</script>

</body>
</html>
