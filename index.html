<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT JEMUY Attendance</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top,#1c2b3a,#0b0f1a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.app{
    width:92%;
    max-width:420px;
}

.header{
    text-align:center;
    margin-bottom:15px;
}

.badge{
    display:inline-block;
    padding:5px 12px;
    background:rgba(0,255,136,0.15);
    border:1px solid rgba(0,255,136,0.3);
    border-radius:20px;
    font-size:12px;
    margin-bottom:8px;
}

.title{
    font-size:22px;
    font-weight:bold;
}

.card{
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(25px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:22px;
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

input,select,textarea{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    outline:none;
    background: rgba(255,255,255,0.08);
    color:white;
}

input::placeholder{color:rgba(255,255,255,0.6);}

textarea{display:none;}

video{
    width:100%;
    border-radius:16px;
    margin-top:12px;
    transform: scaleX(-1);
}

img{
    width:100%;
    border-radius:16px;
    margin-top:10px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    margin-top:10px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.btn:active{transform:scale(0.97);}

.btn-photo{
    background: linear-gradient(135deg,#2196f3,#00b0ff);
    color:white;
}

.btn-send{
    background: linear-gradient(135deg,#00c853,#00e676);
    color:white;
}

.status{
    text-align:center;
    margin-top:12px;
    font-size:13px;
    opacity:0.9;
}

.loc{
    font-size:12px;
    opacity:0.7;
    margin-top:8px;
    text-align:center;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="badge">PT JEMUY SYSTEM</div>
    <div class="title">Absensi Karyawan</div>
</div>

<div class="card">

<input type="text" id="nama" placeholder="nama karyawan">

<select id="status" onchange="cekStatus()">
<option value="hadir">hadir 😎</option>
<option value="izin">izin 📝</option>
<option value="sakit">sakit 🤒</option>
</select>

<textarea id="alasan" placeholder="alasan..."></textarea>

<video id="video" autoplay playsinline></video>

<button class="btn btn-photo" onclick="ambilFoto()">📸 Ambil Foto</button>

<img id="preview">

<div class="loc" id="lokasi">📍 mencari lokasi...</div>

<button class="btn btn-send" onclick="kirim()">🚀 Kirim Absensi</button>

<div class="status" id="statusText"></div>

</div>

</div>

<script>
let foto="";
let lat="";
let lng="";

const scriptURL="https://script.google.com/macros/s/AKfycbxSHxmCNzu5-KtzUhBKT1gQjAcmcxOsZB7gdVi_JPq1GrGPZm5gJMwJt3Fcv8IC/exec";

// kamera
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(stream=>{
    document.getElementById("video").srcObject=stream;
});

// lokasi
navigator.geolocation.getCurrentPosition(pos=>{
    lat=pos.coords.latitude;
    lng=pos.coords.longitude;
    document.getElementById("lokasi").innerText="📍 "+lat+", "+lng;
});

// alasan
function cekStatus(){
    let s=document.getElementById("status").value;
    document.getElementById("alasan").style.display=
    (s=="izin"||s=="sakit")?"block":"none";
}

// foto
function ambilFoto(){
    let v=document.getElementById("video");
    let c=document.createElement("canvas");
    let ctx=c.getContext("2d");

    c.width=v.videoWidth;
    c.height=v.videoHeight;

    ctx.translate(c.width,0);
    ctx.scale(-1,1);
    ctx.drawImage(v,0,0);

    foto=c.toDataURL("image/png");
    document.getElementById("preview").src=foto;
}

// kirim
function kirim(){
    let nama=document.getElementById("nama").value;
    let status=document.getElementById("status").value;
    let alasan=document.getElementById("alasan").value;

    if(!nama) return alert("isi nama");
    if(!foto) return alert("ambil foto dulu");

    document.getElementById("statusText").innerText="mengirim...";

    fetch(scriptURL,{
        method:"POST",
        body:JSON.stringify({
            nama,status,alasan,
            latitude:lat,
            longitude:lng,
            foto:foto,
            waktu:new Date().toISOString()
        })
    })
    .then(res=>res.text())
    .then(data=>{
        document.getElementById("statusText").innerText="✅ berhasil absen";
    })
    .catch(err=>{
        document.getElementById("statusText").innerText="❌ gagal";
    });
}
</script>

</body>
</html>
