<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT JEMUY - Smart Attendance</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0b0f1a,#1b3a4b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:92%;
    max-width:450px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    border-radius:22px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

h1{
    margin:0;
    font-size:22px;
}

.subtitle{
    font-size:12px;
    opacity:0.7;
    margin-bottom:20px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    outline:none;
}

textarea{display:none;}

video{
    width:100%;
    border-radius:14px;
    margin-top:12px;
    transform: scaleX(-1);
}

img{
    width:100%;
    border-radius:14px;
    margin-top:10px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-weight:bold;
    cursor:pointer;
}

.btn1{background:#2196f3;color:white;}
.btn2{background:linear-gradient(135deg,#00c853,#00e676);color:white;}

.status{
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

.loc{
    font-size:12px;
    opacity:0.8;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="card">

<h1>🏢 PT JEMUY</h1>
<div class="subtitle">smart attendance system</div>

<input type="text" id="nama" placeholder="nama karyawan">

<select id="status" onchange="cekStatus()">
<option value="hadir">hadir 😎</option>
<option value="izin">izin 📝</option>
<option value="sakit">sakit 🤒</option>
</select>

<textarea id="alasan" placeholder="alasan..."></textarea>

<video id="video" autoplay playsinline></video>

<button class="btn1" onclick="ambilFoto()">📸 ambil foto</button>
<img id="preview">

<div class="loc" id="lokasi">📍 loading lokasi...</div>

<button class="btn2" onclick="kirim()">🚀 kirim absensi</button>

<div class="status" id="statusText"></div>

</div>

<script>
let foto = "";
let lat = "";
let lng = "";

const scriptURL = "https://script.google.com/macros/s/AKfycbymN4HA5PTDDLen31FcS6ppl0PkGK7PucicOsNbRFkXh1dsoqBJU6l96bhONDynHw/exec";

navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(stream=>{
    document.getElementById("video").srcObject = stream;
});

navigator.geolocation.getCurrentPosition(pos=>{
    lat = pos.coords.latitude;
    lng = pos.coords.longitude;
    document.getElementById("lokasi").innerText =
    "📍 " + lat + ", " + lng;
});

function cekStatus(){
    let s = document.getElementById("status").value;
    document.getElementById("alasan").style.display =
    (s=="izin"||s=="sakit") ? "block":"none";
}

function ambilFoto(){
    let video = document.getElementById("video");
    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.translate(canvas.width,0);
    ctx.scale(-1,1);
    ctx.drawImage(video,0,0);

    foto = canvas.toDataURL("image/png");
    document.getElementById("preview").src = foto;
}

function sudahAbsen(nama){
    return localStorage.getItem("absen_"+nama) === new Date().toDateString();
}

function simpanAbsen(nama){
    localStorage.setItem("absen_"+nama,new Date().toDateString());
}

function kirim(){
    let nama = document.getElementById("nama").value;
    let status = document.getElementById("status").value;
    let alasan = document.getElementById("alasan").value;

    if(!nama) return alert("isi nama dulu");
    if(!foto) return alert("ambil foto dulu");

    if(sudahAbsen(nama)){
        document.getElementById("statusText").innerText =
        "⚠️ sudah absen hari ini";
        return;
    }

    document.getElementById("statusText").innerText="mengirim...";

    fetch(scriptURL,{
        method:"POST",
        body:JSON.stringify({
            nama,status,alasan,
            latitude:lat,
            longitude:lng,
            foto:foto,
            waktu:new Date().toISOString()
        })
    })
    .then(res=>res.text())
    .then(res=>{
        simpanAbsen(nama);
        document.getElementById("statusText").innerText="✅ berhasil absen";
    })
    .catch(err=>{
        document.getElementById("statusText").innerText="❌ gagal kirim";
    });
}
</script>

</body>
</html>
