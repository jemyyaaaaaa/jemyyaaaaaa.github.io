<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT JEMUY | Attendance System</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b1220;
    color:#e5e7eb;
}

/* TOP BAR */
.topbar{
    padding:18px 20px;
    background:#0f172a;
    border-bottom:1px solid rgba(255,255,255,0.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-weight:600;
    letter-spacing:1px;
}

.badge{
    font-size:11px;
    padding:5px 10px;
    background:#1f2937;
    border-radius:20px;
    color:#22c55e;
}

/* CONTAINER */
.container{
    max-width:420px;
    margin:30px auto;
    padding:0 15px;
}

/* CARD */
.card{
    background:#111827;
    border:1px solid rgba(255,255,255,0.05);
    border-radius:16px;
    padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* INPUT */
input,select,textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    background:#0b1220;
    color:white;
    outline:none;
}

textarea{display:none;}

label{
    font-size:12px;
    opacity:0.7;
}

/* VIDEO */
video{
    width:100%;
    border-radius:12px;
    margin-top:10px;
    transform: scaleX(-1);
}

/* IMAGE */
img{
    width:100%;
    border-radius:12px;
    margin-top:10px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.btn:active{transform:scale(0.98);}

.primary{
    background:#2563eb;
    color:white;
}

.success{
    background:#22c55e;
    color:black;
}

/* STATUS */
.status{
    margin-top:12px;
    text-align:center;
    font-size:13px;
    color:#9ca3af;
}

.location{
    font-size:12px;
    opacity:0.7;
    margin-top:8px;
    text-align:center;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="brand">PT JEMUY</div>
    <div class="badge">Attendance System</div>
</div>

<div class="container">

<div class="card">

<label>Nama Karyawan</label>
<input type="text" id="nama" placeholder="Masukkan nama">

<label>Status Kehadiran</label>
<select id="status" onchange="cekStatus()">
<option value="hadir">Hadir</option>
<option value="izin">Izin</option>
<option value="sakit">Sakit</option>
</select>

<textarea id="alasan" placeholder="alasan"></textarea>

<video id="video" autoplay playsinline></video>

<button class="btn primary" onclick="ambilFoto()">Ambil Foto</button>

<img id="preview">

<div class="location" id="lokasi">Mengambil lokasi...</div>

<button class="btn success" onclick="kirim()">Kirim Absensi</button>

<div class="status" id="statusText"></div>

</div>

</div>

<script>
let foto="";
let lat="";
let lng="";

const scriptURL="https://script.google.com/macros/s/AKfycbyiPATx3FJf7JyP5FEWJme2fcvl6_k3oOaqb6BalE7UMDH5VN0B05_7zPa2GLrDxA/exec";

// kamera
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(stream=>{
    document.getElementById("video").srcObject=stream;
});

// lokasi
navigator.geolocation.getCurrentPosition(pos=>{
    lat=pos.coords.latitude;
    lng=pos.coords.longitude;
    document.getElementById("lokasi").innerText=
    "Lokasi: "+lat+", "+lng;
});

// alasan
function cekStatus(){
    let s=document.getElementById("status").value;
    document.getElementById("alasan").style.display=
    (s=="izin"||s=="sakit")?"block":"none";
}

// foto
function ambilFoto(){
    let v=document.getElementById("video");
    let c=document.createElement("canvas");
    let ctx=c.getContext("2d");

    c.width=v.videoWidth;
    c.height=v.videoHeight;

    ctx.translate(c.width,0);
    ctx.scale(-1,1);
    ctx.drawImage(v,0,0);

    foto=c.toDataURL("image/png");
    document.getElementById("preview").src=foto;
}

// kirim
function kirim(){
    let nama=document.getElementById("nama").value;
    let status=document.getElementById("status").value;
    let alasan=document.getElementById("alasan").value;

    if(!nama) return alert("isi nama");
    if(!foto) return alert("ambil foto");

    document.getElementById("statusText").innerText="Mengirim...";

    fetch(scriptURL,{
        method:"POST",
        body:JSON.stringify({
            nama,status,alasan,
            latitude:lat,
            longitude:lng,
            foto:foto,
            waktu:new Date().toISOString()
        })
    })
    .then(res=>res.text())
    .then(data=>{
        document.getElementById("statusText").innerText="Berhasil Absen";
    })
    .catch(err=>{
        document.getElementById("statusText").innerText="Gagal Kirim";
    });
}
</script>

</body>
</html>
