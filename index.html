<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>absen dulu dong</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    text-align: center;
    color: white;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 20px;
    border-radius: 20px;
    max-width: 350px;
    margin: auto;
}

input, select, textarea {
    padding: 10px;
    width: 90%;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
}

button {
    padding: 12px;
    width: 100%;
    border-radius: 12px;
    margin-top: 10px;
    background: #00c6ff;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

video {
    width: 100%;
    border-radius: 10px;
    transform: scaleX(-1);
}

img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}
</style>
</head>

<body>

<h2>absen dulu dong</h2>

<div class="card">

<input type="text" id="nama" placeholder="Masukkan Nama">

<select id="status">
    <option value="hadir">Hadir 😎</option>
    <option value="izin">Izin 📝</option>
    <option value="sakit">Sakit 🤒</option>
</select>

<!-- ALASAN -->
<textarea id="alasan" placeholder="Tulis alasan kamu disini ya boss..." style="display:none;"></textarea>

<video id="video" autoplay playsinline></video>

<button onclick="ambilFoto()">📸 ambil Foto</button>

<img id="preview">

<p id="lokasi">📍 mengambil lokasi...</p>

<button onclick="kirim()">🚀 Kirim Absensi</button>

<p id="statusText"></p>

</div>

<script>
let fotoData = "";
let latitude = "";
let longitude = "";

// kamera
navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" }
})
.then(stream => {
    document.getElementById("video").srcObject = stream;
});

// GPS
navigator.geolocation.getCurrentPosition(pos => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;

    document.getElementById("lokasi").innerText =
        "📍 " + latitude + ", " + longitude;
});

// FIX: EVENT LISTENER STATUS
document.getElementById("status").addEventListener("change", function() {
    let status = this.value;
    let alasan = document.getElementById("alasan");

    if (status === "Izin" || status === "Sakit") {
        alasan.style.display = "block";
    } else {
        alasan.style.display = "none";
    }
});

// ambil foto (hasil normal)
function ambilFoto() {
    let canvas = document.createElement("canvas");
    let video = document.getElementById("video");
    let ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.save();
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    ctx.restore();

    fotoData = canvas.toDataURL("image/png");
    document.getElementById("preview").src = fotoData;
}

// Kirim
function kirim() {
    let nama = document.getElementById("nama").value;
    let status = document.getElementById("status").value;
    let alasan = document.getElementById("alasan").value;

    if (!nama) {
        alert("nama dulu dong 😅");
        return;
    }

    if (!fotoData) {
        alert("foto dulu dong 📸");
        return;
    }

    fetch("https://script.google.com/macros/s/AKfycbwEpV-uMN6RkRWu4wKemzbTuV8STGAjM5J7L5Ng4oHT3o9QEispK7glBAR02h4f7A/exec", {
        method: "POST",
        body: JSON.stringify({
            nama: nama,
            waktu: new Date().toLocaleString(),
            status: status,
            alasan: alasan,
            latitude: latitude,
            longitude: longitude,
            foto: fotoData
        })
    })
    .then(res => res.text())
    .then(() => {
        document.getElementById("statusText").innerText =
            "🔥 mantap absensi kamu masuk!";
    });
}
</script>

</body>
</html>
